[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "navekf_py"
version = "0.1.0"
description = "Python reference for nav-ekf: IMU/GPS simulator, IMU integrator, error-state EKF"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
markers = ["slow: Monte Carlo tests (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 130
target-version = "py311"
src = ["python", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY"]
ignore = ["E741"]
